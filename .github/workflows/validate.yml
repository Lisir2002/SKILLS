name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 校验技能包规范（SKILL-AGENTS.md §7）
        run: python3 scripts/validate_skills.py

      - name: 运行 evals（触发路由 / 质量 / 冒烟）
        run: python3 scripts/run_evals.py
